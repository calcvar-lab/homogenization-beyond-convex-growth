name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - name: Check axioms of the main theorems
        run: lake env lean scripts/CheckAxioms.lean
      - name: Check that no proof is left incomplete
        run: |
          # mentions inside backquotes (docstrings) are ignored
          ! grep -rnwE "sorry|admit|native_decide" Homogenization Homogenization.lean | grep -vE '`(sorry|admit|native_decide)`'
          ! grep -rnE "^\s*axiom " Homogenization Homogenization.lean
